gateway:
  security:
    public-paths:
      - "/api/v1/auth/login"
      - "/api/v1/auth/register"
      - "/api/v1/auth/refresh"
      - "/api/v1/auth/google"
      - "/eureka"

spring:
  cloud:
    gateway:
      routes:
        # Rotas específicas para login e register vêm antes da rota geral do ms-auth
        # para aplicar rate limiting por IP (brute force protection)
        - id: ms-auth-login
          uri: lb://ms-auth
          predicates:
            - Path=/api/v1/auth/login
            - Method=POST
          filters:
            - name: JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 5
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth
                statusCodes:
                  - 502
                  - 503
                  - 504

        - id: ms-auth-register
          uri: lb://ms-auth
          predicates:
            - Path=/api/v1/auth/register
            - Method=POST
          filters:
            - name: JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 3
                redis-rate-limiter.requestedTokens: 3
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth
                statusCodes:
                  - 502
                  - 503
                  - 504

        - id: ms-auth
          uri: lb://ms-auth
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth
                statusCodes:
                  - 502
                  - 503
                  - 504

        - id: ms-social
          uri: lb://ms-social
          predicates:
            - Path=/api/v1/creators/**, /api/v1/social/**
          filters:
            - name: JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY
            - name: CircuitBreaker
              args:
                name: socialCircuitBreaker
                fallbackUri: forward:/fallback/social
                statusCodes:
                  - 502
                  - 503
                  - 504

        - id: ms-creation
          uri: lb://ms-creation
          predicates:
            - Path=/api/v1/creation/outfits,/api/v1/creation/outfits/**
          filters:
            - name: JwtAuthenticationFilter
            - name: MultipartContentTypeFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY
            - name: CircuitBreaker
              args:
                name: creationCircuitBreaker
                fallbackUri: forward:/fallback/creation
                statusCodes:
                  - 502
                  - 503
                  - 504

        - id: ms-feed
          uri: lb://ms-feed
          predicates:
            - Path=/api/v1/outfits/**
          filters:
            - name: JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY
            - name: CircuitBreaker
              args:
                name: feedCircuitBreaker
                fallbackUri: forward:/fallback/feed
                statusCodes:
                  - 502
                  - 503
                  - 504